# 本地 git hook 配置（AGENTS.md 八、CI/CD 强制集成）
# 每次提交前执行通用文本检查 + 前端 lint/format + Rust 格式化；
# 全量测试（cargo test / vitest / clippy）走 pre-push 钩子，避免拖慢每次提交。
repos:
  # 通用钩子：尾随空白、行尾、yaml 校验、大文件拦截、合并冲突检测
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  # 本地钩子：调用项目自身工具链
  # 注：未指定 stages 的钩子默认继承 default_stages（含全部 stage，pre-push 也会跑）；
  # 轻量钩子显式限定 stages: [pre-commit]，避免推送时被 xargs 按核数分块并行拉起大量实例
  - repo: local
    hooks:
      # 前端 ESLint：仅检查 JS/TS/Vue 源码
      - id: eslint
        name: eslint（前端代码静态检查）
        entry: npx eslint
        language: system
        types_or: [javascript, ts, vue]
        stages: [pre-commit]
      # 前端 Prettier：格式化一致性检查
      - id: prettier
        name: prettier（前端格式化检查）
        entry: npx prettier --check
        language: system
        types_or: [javascript, ts, vue, json, css, scss, html, markdown]
        stages: [pre-commit]
      # Rust rustfmt：格式化一致性检查
      - id: rustfmt
        name: rustfmt（Rust 格式化检查）
        entry: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
        language: system
        files: ^src-tauri/.*\.rs$
        stages: [pre-commit]

  # pre-push 阶段的重量级检查：静态分析 + 全量测试（避免拖慢每次提交）
  # 注：entry 用 bash -c 包装，忽略 pre-commit 自动追加的文件参数
  #     （否则 cargo test / vitest 会把文件名当作测试过滤条件导致误失败）
  # 注：pass_filenames: false 使钩子整段推送只执行一次——pre-commit 默认按 CPU
  #     核数把文件分块并行跑多个实例（本机 24 核，整段 range 数百文件时会把
  #     npm test 并行拉起约 10 组、eslint 30 个实例，内存叠加可达 15GB+，
  #     2026-08-15 推送 OOM 的第二层根因）
  - repo: local
    hooks:
      # Rust clippy：静态分析，warnings 视为错误
      - id: clippy
        name: clippy（Rust 静态分析）
        entry: bash -c 'cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings'
        language: system
        files: ^src-tauri/.*\.rs$
        stages: [pre-push]
        pass_filenames: false
      # Rust 全量单元测试
      - id: cargo-test
        name: cargo test（Rust 全量测试）
        entry: bash -c 'cargo test --manifest-path src-tauri/Cargo.toml'
        language: system
        files: ^src-tauri/.*\.rs$
        stages: [pre-push]
        pass_filenames: false
      # 前端全量单元测试（Vitest）
      - id: vitest
        name: vitest（前端全量测试）
        entry: bash -c 'npm test'
        language: system
        types_or: [javascript, ts, vue]
        stages: [pre-push]
        pass_filenames: false
