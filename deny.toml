# cargo-deny 配置：许可证与依赖审查（AGENTS.md 八、CI/CD 强制集成）
# 本文件用于 quality-gate workflow 的 cargo-deny check 步骤。

[licenses]
# v2 配置语义（PR #611）：unlicensed 默认 deny、不在 allow/exception 的许可证一律 deny
version = 2
# 允许的许可证清单：Tauri 生态（tauri/wry/tao/serde 等）均为宽松许可；
# 发现新依赖未覆盖时，评估后加入 allow 或 exception
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
]

[bans]
# 同一依赖多版本共存：警告不阻断（避免过度严格导致 CI 频繁误伤）
multiple-versions = "warn"
