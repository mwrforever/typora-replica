[package]
name = "typora-replica"
version = "0.1.0"
description = "MarkWell - 全功能 Markdown 编辑器（Typora 风格，原创实现）"
license = "MIT"
authors = ["mwrforever"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "typora_replica_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8.35"
walkdir = "2.5.0"
notify = "8.2.0"
trash = "5.2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"

[dev-dependencies]
# 命令层测试（unwatch_dir 幂等/多槽并存）经 tauri::test mock 运行时直呼命令——
# tauri 的 test feature（空 feature，仅编译 mock 模块）只对测试构建生效。
# 注：default-features=false 无法把 wry 挡在测试构建外——feature 按依赖边求并集，
# 正常依赖（tauri features=[] 即带 default）与插件均已启用 default→wry；
# 测试二进制带 wry 代码在 Windows 启动需 Common-Controls v6 manifest
# （TaskDialogIndirect 入口），已由 build.rs 对全部目标统一嵌入（D2）。
tauri = { version = "2", features = ["test"] }
