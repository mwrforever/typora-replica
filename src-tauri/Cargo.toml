[package]
name = "typora-replica"
version = "0.1.0"
description = "MarkWell - 全功能 Markdown 编辑器（Typora 风格，原创实现）"
license = "MIT"
authors = ["mwrforever"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "typora_replica_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：asset:// 本地图片协议与 asset_protocol_scope 运行时授权 API
# （07 D-4 动态授权依赖；未启用时 allow_asset_directory 无法编译，协议也不注册）
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8.35"
# 06 跨文件搜索：并行遍历（内置 hidden/gitignore 过滤）+ 线性时间正则引擎
ignore = "0.4"
regex = "1"
walkdir = "2.5.0"
notify = "8.2.0"
trash = "5.2"
# 07 图片粘贴存盘：相对路径计算（跨盘符返回 None）
pathdiff = "0.2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"

[features]
# 08 T7 DevTools：release 构建显式启用（debug 构建默认编译 devtools 能力；
# tauri 的 devtools 方法带 #[cfg(any(debug_assertions, feature = "devtools"))] 门控）
devtools = ["tauri/devtools"]

[dev-dependencies]
# 命令层测试（unwatch_dir 幂等/多槽并存）经 tauri::test mock 运行时直呼命令——
# tauri 的 test feature（空 feature，仅编译 mock 模块）只对测试构建生效。
# 注：default-features=false 无法把 wry 挡在测试构建外——feature 按依赖边求并集，
# 正常依赖（tauri features=[] 即带 default）与插件均已启用 default→wry；
# 测试二进制带 wry 代码在 Windows 启动需 Common-Controls v6 manifest
# （TaskDialogIndirect 入口），已由 build.rs 对全部目标统一嵌入（D2）。
tauri = { version = "2", features = ["test"] }
