# Build Verification：Windows 构建 + E2E/Smoke 测试 + 产物归档
# PR 与 main 推送触发（合入需 Quality Gate 与 Build 均绿，由 GitHub 分支保护规则保证）。
name: Build Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Windows 构建 ─────────────────────────────────────────────
  tauri-build:
    name: Windows 构建（Tauri Build）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 额外缓存 tauri bundler 下载的工具链（NSIS 等），避免每次打包重新下载
          cache-directories: |
            $LOCALAPPDATA/tauri
            ~/.cache/tauri
      - name: 安装前端依赖
        run: npm ci
      - name: 前端类型检查与构建
        run: npm run build
      - name: Tauri 构建（release 安装包）
        shell: bash
        run: |
          set -euo pipefail
          # bundler 需下载 NSIS 等工具，网络偶发中断（io: Peer disconnected）时自动重试
          for attempt in 1 2 3; do
            echo "=== Tauri 构建尝试 $attempt/3 ==="
            if npx tauri build; then
              echo "Tauri 构建成功"
              exit 0
            fi
            echo "构建失败（疑似 bundler 下载工具的网络问题），清理部分缓存后重试..."
            rm -rf "$LOCALAPPDATA/tauri" "$HOME/.cache/tauri" 2>/dev/null || true
          done
          echo "::error::Tauri 构建连续 3 次失败"
          exit 1
      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  # ── E2E / Smoke Test ─────────────────────────────────────────
  e2e:
    name: E2E / Smoke（WebdriverIO + tauri-driver）
    runs-on: windows-latest
    needs: tauri-build
    # 总超时保护：任何步骤卡死（如外部下载）不无限挂起
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装前端依赖
        run: npm ci
      - name: 编译 debug 二进制（E2E 目标，rust-cache 命中时快速）
        run: cargo build --manifest-path src-tauri/Cargo.toml
      - name: 安装 WebView2 Runtime（规避 runner 自带版本问题）
        shell: bash
        run: |
          # runner 镜像自带的 WebView2 Runtime（150.x）在本环境存在自动化兼容问题
          # （msedgedriver 启动 app 后 DevTools 端口不产生，DevToolsActivePort 错误）。
          # 安装 Evergreen 最新版（1.7MB 引导安装器）后按新版本适配驱动。
          set -euo pipefail
          echo "下载 WebView2 Evergreen 安装器..."
          curl -L --fail --connect-timeout 15 --max-time 120 -o /tmp/wv2-setup.exe \
            "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
          ls -la /tmp/wv2-setup.exe
          echo "静默安装（服务会话可能挂起，4 分钟超时保护）..."
          # 安装器在 CI 服务会话可能挂起拖垮整个 job，用 timeout 保护；
          # 即使超时，安装器可能已在后台继续，不阻断后续步骤
          timeout 240 /tmp/wv2-setup.exe /silent /install > /tmp/wv2-install.log 2>&1 || {
            echo "::warning::WebView2 安装器未在 4 分钟内完成（可能仍在后台安装），继续后续步骤"
          }
          tail -5 /tmp/wv2-install.log 2>/dev/null || true

      - name: 读取 WebView2 运行时版本
        id: wv2ver
        shell: bash
        run: |
          set -euo pipefail
          # 注意：不能用 msedge.exe --version 探测版本——CI 服务会话中 Edge 启动后不退出，
          # 会导致步骤挂起（曾卡死 20 分钟超时）。只读注册表，且加 timeout 保护。
          echo "[WebView2 运行时注册表]"
          WV2_VERSION=$(timeout 30 reg query "HKLM\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" //v pv 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          if [ -z "$WV2_VERSION" ]; then
            echo "reg 查询失败或超时，改用 PowerShell 读取..."
            WV2_VERSION=$(timeout 30 powershell -NoProfile -Command "(Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue).pv" 2>/dev/null || true)
          fi
          if [ -z "$WV2_VERSION" ]; then
            echo "::error::无法读取 WebView2 运行时版本（CI 环境异常，需人工排查）"
            exit 1
          fi
          echo "WebView2 运行时版本: $WV2_VERSION"
          echo "version=$WV2_VERSION" >> "$GITHUB_OUTPUT"

      - name: 恢复 tauri-driver 缓存（避免每次编译 3-4 分钟）
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-v2

      - name: 安装 tauri-driver（WebDriver 服务）
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          if command -v tauri-driver >/dev/null 2>&1 && tauri-driver --version >/dev/null 2>&1; then
            echo "tauri-driver 已缓存，跳过编译"
          else
            cargo install tauri-driver --locked
          fi

      - name: 恢复 Edge WebDriver 缓存（跨 run 复用，秒级恢复）
        uses: actions/cache@v4
        with:
          path: e2e/.driver
          key: msedgedriver-${{ steps.wv2ver.outputs.version }}
          restore-keys: msedgedriver-

      - name: 下载 Edge WebDriver（多源回退 + 版本校验）
        shell: bash
        run: |
          set -euo pipefail
          WV2_VERSION="${{ steps.wv2ver.outputs.version }}"
          # 缓存命中且版本正确则跳过下载
          if [ -f e2e/.driver/msedgedriver.exe ] && e2e/.driver/msedgedriver.exe --version 2>/dev/null | grep -q "$WV2_VERSION"; then
            echo "驱动已缓存且版本匹配，跳过下载"
          else
            mkdir -p e2e/.driver
            rm -f e2e/.driver/msedgedriver.exe
            echo "下载 msedgedriver $WV2_VERSION ..."
            # 源1：微软官方 CDN；源2：npmmirror 二进制镜像（官方源在 CI 网络曾卡死，多源回退）
            if ! curl -L --fail --connect-timeout 15 --max-time 120 -o e2e/.driver/driver.zip \
              "https://msedgedriver.microsoft.com/$WV2_VERSION/edgedriver_win64.zip"; then
              echo "官方源下载失败，切换 npmmirror 镜像..."
              curl -L --fail --connect-timeout 15 --max-time 120 -o e2e/.driver/driver.zip \
                "https://cdn.npmmirror.com/binaries/edgedriver/$WV2_VERSION/edgedriver_win64.zip"
            fi
            unzip -o -q e2e/.driver/driver.zip -d e2e/.driver
            rm -f e2e/.driver/driver.zip
          fi
          echo "[下载的驱动版本]"
          e2e/.driver/msedgedriver.exe --version
          echo "Edge WebDriver 就绪"
      - name: 启动 Vite dev server
        shell: bash
        run: |
          # 后台启动前端开发服务器，等待端口就绪后退出（供 E2E 窗口加载）
          nohup npm run dev > e2e/vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s http://localhost:1420 > /dev/null; then echo "vite 已就绪"; exit 0; fi
            sleep 2
          done
          echo "vite 启动超时"; exit 1
      - name: 启动 tauri-driver 并运行 E2E 测试
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          ls -la src-tauri/target/debug/typora-replica.exe
          # 【诊断】app 能否在 CI 会话独立启动（区分 app 问题 vs 自动化链路问题）
          echo "=== app 启动自检（8 秒存活测试）==="
          export TAURI_WEBVIEW_AUTOMATION=true
          src-tauri/target/debug/typora-replica.exe --use-localhost > e2e/app.log 2>&1 &
          APP_PID=$!
          sleep 8
          if kill -0 $APP_PID 2>/dev/null; then
            echo "app 存活（PID $APP_PID）"
            tasklist //FI "IMAGENAME eq typora-replica.exe" 2>/dev/null | grep -i typora || true
          else
            echo "::error::app 启动后立即退出（WebView2 初始化失败？）"
            cat e2e/app.log
            exit 1
          fi
          kill $APP_PID 2>/dev/null || true
          taskkill //IM typora-replica.exe //F 2>/dev/null || true
          # 关键：WebView2 子进程（msedgewebview2.exe）在 app 被杀后仍会残留，
          # 锁定 user data 目录导致后续 msedgedriver 启动的实例无法初始化
          # （表现为 DevToolsActivePort file doesn't exist），必须彻底清理
          taskkill //IM msedgewebview2.exe //F 2>/dev/null || true
          echo "=== 自检通过，进入自动化测试 ==="
          # 拉起 WebDriver 服务（显式指定 Edge 驱动路径），就绪后执行测试
          tauri-driver --native-driver e2e/.driver/msedgedriver.exe > e2e/tauri-driver.log 2>&1 &
          DRIVER_PID=$!
          for i in $(seq 1 30); do
            if curl -s http://localhost:4444/status > /dev/null; then echo "tauri-driver 已就绪"; break; fi
            sleep 2
          done
          # 诊断：驱动进程是否存活（msedgedriver 异常退出会直接导致会话失败）
          tasklist //FI "IMAGENAME eq msedgedriver.exe" 2>/dev/null | grep -i msedgedriver || echo "::warning::msedgedriver 进程未存活"
          npm run test:e2e
          EXIT_CODE=$?
          kill $DRIVER_PID 2>/dev/null || true
          exit $EXIT_CODE
      - name: 上传 E2E 日志（失败时可排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            e2e/logs
            e2e/vite.log
            e2e/tauri-driver.log
            e2e/app.log
          if-no-files-found: ignore
