# Build Verification：Windows 构建 + E2E/Smoke 测试 + 产物归档
# PR 与 main 推送触发（合入需 Quality Gate 与 Build 均绿，由 GitHub 分支保护规则保证）。
name: Build Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Windows 构建 ─────────────────────────────────────────────
  tauri-build:
    name: Windows 构建（Tauri Build）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 额外缓存 tauri bundler 下载的工具链（NSIS 等），避免每次打包重新下载
          cache-directories: |
            $LOCALAPPDATA/tauri
            ~/.cache/tauri
      - name: 安装前端依赖
        run: npm ci
      - name: 前端类型检查与构建
        run: npm run build
      - name: Tauri 构建（release 安装包）
        shell: bash
        run: |
          set -euo pipefail
          # bundler 需下载 NSIS 等工具，网络偶发中断（io: Peer disconnected）时自动重试
          for attempt in 1 2 3; do
            echo "=== Tauri 构建尝试 $attempt/3 ==="
            if npx tauri build; then
              echo "Tauri 构建成功"
              exit 0
            fi
            echo "构建失败（疑似 bundler 下载工具的网络问题），清理部分缓存后重试..."
            rm -rf "$LOCALAPPDATA/tauri" "$HOME/.cache/tauri" 2>/dev/null || true
          done
          echo "::error::Tauri 构建连续 3 次失败"
          exit 1
      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  # ── CI 冒烟测试 ──────────────────────────────────────────────
  # 说明：完整 WebDriver E2E（WebdriverIO + tauri-driver）因 CI 的 WebView2 150.x
  # 对 --remote-debugging-port=0 不写 DevToolsActivePort 文件，msedgedriver 会话
  # 创建失败，降级为 CDP 冒烟测试（e2e/smoke-ci.mjs），覆盖相同验证目标：
  #   应用启动 + 前端渲染 + Rust 命令链路。
  # 冒烟使用固定调试端口方案（Playwright 官方 WebView2 文档同款），不依赖
  # DevToolsActivePort 文件，跨 WebView2 版本稳定。
  # 完整 E2E 在本地环境正常，执行方式见 e2e/README（npm run test:e2e）。
  e2e:
    name: CI 冒烟（应用启动/前端渲染/Rust 链路）
    runs-on: windows-latest
    needs: tauri-build
    # 总超时保护：任何步骤卡死不无限挂起
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装前端依赖
        run: npm ci
      - name: 编译 debug 二进制（冒烟目标，rust-cache 命中时快速）
        run: cargo build --manifest-path src-tauri/Cargo.toml
      - name: 启动 Vite dev server
        shell: bash
        run: |
          # 后台启动前端开发服务器，等待端口就绪后退出（供应用窗口加载）
          nohup npm run dev > e2e/vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s http://localhost:1420 > /dev/null; then echo "vite 已就绪"; exit 0; fi
            sleep 2
          done
          echo "vite 启动超时"; exit 1
      - name: 启动应用并运行冒烟测试
        shell: bash
        run: |
          set -euo pipefail
          # ── 环境前置诊断（每次运行都输出，便于对照 WebView2 版本与提权状态）──
          echo "=== 运行身份与完整性级别 ==="
          whoami || true
          net session >/dev/null 2>&1 && echo "（当前进程为提权/管理员）" || echo "（当前进程非提权）"
          echo "=== WebView2 Runtime 版本（镜像自带）==="
          reg query "HKLM\\SOFTWARE\\WOW6432Node\\Microsoft\\EdgeUpdate\\Clients\\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" //v pv 2>/dev/null || true
          # WebView2 调试参数注入（固定端口方案）：
          # 1. TAURI_WEBVIEW_AUTOMATION=true：声明自动化意图（Windows 上 wry 当前
          #    无操作，保留以对齐 tauri-driver 的行为契约）
          # 2. WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS=--remote-debugging-port=9222：
          #    让 WebView2 浏览器进程监听固定调试端口，冒烟脚本直接连 CDP。
          export TAURI_WEBVIEW_AUTOMATION=true
          export WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS="--remote-debugging-port=9222"
          export SMOKE_CDP_PORT=9222
          ls -la src-tauri/target/debug/typora-replica.exe

          # ── 冒烟路径 A：psexec -l 受限令牌启动应用（强制降权）──
          # 背景：镜像自带 WebView2 150.0.4078.105 存在回归——提权（High Integrity）
          # 进程下 CDP 调试端口静默不监听（WebView2Feedback#5639）。runner 镜像
          # 疑禁用 UAC：交互会话令牌不过滤，schtasks /IT 与新用户会话 0 均不可行。
          # psexec -l 直接剥离令牌中的 Administrators 组（不依赖 UAC 过滤），
          # 在交互会话内强制中等完整性，是唯一确定性降权手段。
          A_READY=false
          curl -sL --fail --connect-timeout 15 --max-time 60 -o "$TEMP/psexec64.exe" "https://live.sysinternals.com/psexec64.exe" \
            && chmod +x "$TEMP/psexec64.exe" || echo "::warning::psexec 下载失败，路径 A 不可用"
          if [ -f "$TEMP/psexec64.exe" ]; then
            WINPWD=$(pwd -W)
          cat > e2e/run-smoke-app.cmd <<EOF
          @echo off
          whoami /groups > "%TEMP%\markwell-token.log" 2>&1
          set TAURI_WEBVIEW_AUTOMATION=true
          set WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS=--remote-debugging-port=9222
          "$WINPWD\src-tauri\target\debug\typora-replica.exe" --use-localhost > "%TEMP%\markwell-app.log" 2>&1
          EOF
            echo "=== 路径 A：psexec -l 受限令牌启动应用 ==="
            "$TEMP/psexec64.exe" -accepteula -nobanner -l -d cmd //c "$WINPWD\\e2e\\run-smoke-app.cmd" || true
            for i in $(seq 1 25); do
              if tasklist //FI "IMAGENAME eq typora-replica.exe" 2>/dev/null | grep -qi typora; then
                echo "受限令牌实例已存活"; break
              fi
              sleep 1
            done
            if tasklist //FI "IMAGENAME eq typora-replica.exe" 2>/dev/null | grep -qi typora; then
              A_READY=true
            else
              echo "::warning::路径 A 应用未存活（psexec 受限令牌启动失败）"
            fi
          fi
          if [ "$A_READY" = true ]; then
            tasklist //FI "IMAGENAME eq typora-replica.exe" //FO LIST 2>/dev/null | grep -E "Session|Image" || true
            echo "=== 受限令牌（whoami /groups）==="
            cat "$LOCALAPPDATA/../Temp/markwell-token.log" 2>/dev/null | grep -iE "S-1-16|Administrat" || echo "令牌信息缺失"
            # 注意：set -e 下 node 失败会直接终止脚本、跳过收尸与诊断，
            # 因此临时关闭 set -e 手动接管退出码（诊断逻辑内置在冒烟脚本内）
            set +e
            node e2e/smoke-ci.mjs
            EXIT_CODE=$?
            set -e
            if [ $EXIT_CODE -ne 0 ]; then
              echo "=== 路径 A 应用输出 ==="
              cat "$LOCALAPPDATA/../Temp/markwell-app.log" 2>/dev/null || true
            fi
            # 路径 A 收尸
            taskkill //IM typora-replica.exe //F 2>/dev/null || true
            taskkill //IM msedgewebview2.exe //F 2>/dev/null || true
          else
            echo "=== 路径 A 不可用，转入路径 B ==="
            EXIT_CODE=1
          fi

          # ── 冒烟路径 B（A 失败时的回退）：151 固定版本运行库 + 策略注入调试端口 ──
          # 本地实验结论：固定版本运行库不理会 WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS
          # 环境变量（端口不开、不写 DevToolsActivePort），须改由 BrowserArguments
          # 策略注入；同时以 BrowserExecutableFolder 策略指向固定版本目录。
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== 路径 A 失败，进入路径 B：151 固定版本运行库 ==="
            WV2_CAB_URL="https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/355004fc-ebbc-42d3-b319-d43be39f8d39/Microsoft.WebView2.FixedVersionRuntime.151.0.4129.78.x64.cab"
            curl -L --fail --connect-timeout 15 --max-time 420 -o "$TEMP/wv2-151.cab" "$WV2_CAB_URL"
            rm -rf "$PWD/e2e/.webview2-runtime" && mkdir -p "$PWD/e2e/.webview2-runtime"
            # 注：Git Bash 的 expand 是 coreutils（制表符工具），必须用 Windows 自带
            "$WINDIR\\System32\\expand.exe" "$TEMP/wv2-151.cab" -F:* "$PWD/e2e/.webview2-runtime" >/dev/null
            WV2_EXE_DIR=$(dirname "$(find "$PWD/e2e/.webview2-runtime" -iname "msedgewebview2.exe" | head -1)")
            [ -n "$WV2_EXE_DIR" ] || { echo "::error::固定版本运行库解包失败"; find "$PWD/e2e/.webview2-runtime" -maxdepth 2 | head -20; exit 1; }
            echo "=== 固定版本运行库目录: $WV2_EXE_DIR ==="
            # Fixed Version v120+ 渲染进程跑在 App Container 内，需授予读取权限
            icacls "$WV2_EXE_DIR" //grant "*S-1-15-2-2:(OI)(CI)(RX)" //grant "*S-1-15-2-1:(OI)(CI)(RX)" >/dev/null 2>&1 || true
            # 指向固定版本 + 策略注入调试端口（HKLM 需提权，runner 满足）
            reg add "HKLM\\SOFTWARE\\Policies\\Microsoft\\Edge\\WebView2" //v BrowserExecutableFolder //t REG_SZ //d "$WV2_EXE_DIR" //f
            reg add "HKLM\\SOFTWARE\\Policies\\Microsoft\\Edge\\WebView2" //v BrowserArguments //t REG_SZ //d "--remote-debugging-port=9222" //f
            # 清掉旧 profile（150 创建）
            rm -rf "$LOCALAPPDATA/com.markwell.app"
            unset SMOKE_APP_DATA_DIR
            src-tauri/target/debug/typora-replica.exe --use-localhost > e2e/app.log 2>&1 &
            set +e
            node e2e/smoke-ci.mjs
            EXIT_CODE=$?
            set -e
            if [ $EXIT_CODE -ne 0 ]; then
              echo "=== 路径 B 应用输出 ==="
              cat e2e/app.log 2>/dev/null || true
            fi
            taskkill //IM typora-replica.exe //F 2>/dev/null || true
            taskkill //IM msedgewebview2.exe //F 2>/dev/null || true
            reg delete "HKLM\\SOFTWARE\\Policies\\Microsoft\\Edge\\WebView2" //v BrowserExecutableFolder //f 2>/dev/null || true
            reg delete "HKLM\\SOFTWARE\\Policies\\Microsoft\\Edge\\WebView2" //v BrowserArguments //f 2>/dev/null || true
          fi
          exit $EXIT_CODE
      - name: 上传冒烟日志（失败时可排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            e2e/vite.log
            e2e/app.log
          if-no-files-found: ignore
