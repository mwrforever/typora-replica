# Build Verification：Windows 构建 + E2E/Smoke 测试 + 产物归档
# PR 与 main 推送触发（合入需 Quality Gate 与 Build 均绿，由 GitHub 分支保护规则保证）。
name: Build Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Windows 构建 ─────────────────────────────────────────────
  tauri-build:
    name: Windows 构建（Tauri Build）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 额外缓存 tauri bundler 下载的工具链（NSIS 等），避免每次打包重新下载
          cache-directories: |
            $LOCALAPPDATA/tauri
            ~/.cache/tauri
      - name: 安装前端依赖
        run: npm ci
      - name: 前端类型检查与构建
        run: npm run build
      - name: Tauri 构建（release 安装包）
        shell: bash
        run: |
          set -euo pipefail
          # bundler 需下载 NSIS 等工具，网络偶发中断（io: Peer disconnected）时自动重试
          for attempt in 1 2 3; do
            echo "=== Tauri 构建尝试 $attempt/3 ==="
            if npx tauri build; then
              echo "Tauri 构建成功"
              exit 0
            fi
            echo "构建失败（疑似 bundler 下载工具的网络问题），清理部分缓存后重试..."
            rm -rf "$LOCALAPPDATA/tauri" "$HOME/.cache/tauri" 2>/dev/null || true
          done
          echo "::error::Tauri 构建连续 3 次失败"
          exit 1
      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  # ── CI 冒烟测试 ──────────────────────────────────────────────
  # 说明：完整 WebDriver E2E（WebdriverIO + tauri-driver）因 CI 的 WebView2 150.x
  # 对 --remote-debugging-port=0 不写 DevToolsActivePort 文件，msedgedriver 会话
  # 创建失败，降级为 CDP 冒烟测试（e2e/smoke-ci.mjs），覆盖相同验证目标：
  #   应用启动 + 前端渲染 + Rust 命令链路。
  # 冒烟使用固定调试端口方案（Playwright 官方 WebView2 文档同款），不依赖
  # DevToolsActivePort 文件，跨 WebView2 版本稳定。
  # 完整 E2E 在本地环境正常，执行方式见 e2e/README（npm run test:e2e）。
  e2e:
    name: CI 冒烟（应用启动/前端渲染/Rust 链路）
    runs-on: windows-latest
    needs: tauri-build
    # 总超时保护：任何步骤卡死不无限挂起
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装前端依赖
        run: npm ci
      - name: 编译 debug 二进制（冒烟目标，rust-cache 命中时快速）
        run: cargo build --manifest-path src-tauri/Cargo.toml
      - name: 启动 Vite dev server
        shell: bash
        run: |
          # 后台启动前端开发服务器，等待端口就绪后退出（供应用窗口加载）
          nohup npm run dev > e2e/vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s http://localhost:1420 > /dev/null; then echo "vite 已就绪"; exit 0; fi
            sleep 2
          done
          echo "vite 启动超时"; exit 1
      - name: 启动应用并运行冒烟测试
        shell: bash
        run: |
          set -euo pipefail
          # ── 环境前置诊断（每次运行都输出，便于对照 WebView2 版本与提权状态）──
          echo "=== 运行身份与完整性级别 ==="
          whoami || true
          whoami /groups 2>/dev/null | grep -i "S-1-16" || true
          net session >/dev/null 2>&1 && echo "（当前进程为提权/管理员）" || echo "（当前进程非提权）"
          echo "=== WebView2 Runtime 版本 ==="
          reg query "HKLM\\SOFTWARE\\WOW6432Node\\Microsoft\\EdgeUpdate\\Clients\\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" //v pv 2>/dev/null || true
          # WebView2 调试参数注入（固定端口方案）：
          # 1. TAURI_WEBVIEW_AUTOMATION=true：声明自动化意图（Windows 上 wry 当前
          #    无操作，保留以对齐 tauri-driver 的行为契约）
          # 2. WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS=--remote-debugging-port=9222：
          #    让 WebView2 浏览器进程监听固定调试端口，冒烟脚本直接连 CDP。
          #    不用 --remote-debugging-port=0：CI 的 WebView2 150 不写
          #    DevToolsActivePort 文件（本地 151 正常），固定端口跨版本稳定。
          export TAURI_WEBVIEW_AUTOMATION=true
          export WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS="--remote-debugging-port=9222"
          export SMOKE_CDP_PORT=9222
          ls -la src-tauri/target/debug/typora-replica.exe
          # ── 降权启动应用（WebView2 150 提权回归规避，方案：计划任务 Basic User 令牌）──
          # 根因：WebView2 150.x 存在回归——提权（High Integrity）进程下即使注入
          # 调试端口参数，CDP 端口也不监听（WebView2Feedback#5639）；runner 的 job
          # 进程本身是提权的，直接拉起的应用继承提权，调试端口必然失效。
          # 为什么不用 runas /trustlevel：CI runner 服务上下文下 runas 静默失败
          # （无输出、非零退出码）。schtasks 注册 /RL LIMITED 一次性任务、
          # /IT 在当前交互会话运行，拿到 Basic User 非提权令牌。
          # 注意：任务进程不继承调用方环境变量，调试参数改由批处理内联注入。
          WINPWD=$(pwd -W)
          cat > e2e/run-smoke-app.cmd <<EOF
          @echo off
          set TAURI_WEBVIEW_AUTOMATION=true
          set WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS=--remote-debugging-port=9222
          "$WINPWD\src-tauri\target\debug\typora-replica.exe" --use-localhost > "$WINPWD\e2e\app.log" 2>&1
          EOF
          schtasks //Delete //TN markwell-smoke //F >/dev/null 2>&1 || true
          schtasks //Create //F //TN markwell-smoke //SC ONCE //ST 00:00 //IT //RL LIMITED \
            //RU "$USERNAME" //TR "$WINPWD\\e2e\\run-smoke-app.cmd"
          echo "=== 降权启动应用 ==="
          schtasks //Run //TN markwell-smoke
          # 确认降权实例已存活（schtasks //Run 立即返回，需轮询进程出现）
          for i in $(seq 1 20); do
            if tasklist //FI "IMAGENAME eq typora-replica.exe" 2>/dev/null | grep -qi typora; then
              echo "降权实例已存活"
              break
            fi
            sleep 1
          done
          if ! tasklist //FI "IMAGENAME eq typora-replica.exe" 2>/dev/null | grep -qi typora; then
            echo "::error::降权启动后应用未存活（任务未执行或应用即退）"
            echo "=== 任务状态诊断 ==="
            schtasks //Query //TN markwell-smoke //V //FO LIST 2>&1 | grep -E "Result|Status|Task To Run|Run As User|Scheduled Task State" || true
            cat e2e/app.log 2>/dev/null || true
            exit 1
          fi
          # 会话核对：期望 Console 交互会话（Session 0 无法创建窗口，CDP 会失败）
          tasklist //FI "IMAGENAME eq typora-replica.exe" //FO LIST 2>/dev/null | grep -E "Session|Image" || true
          # 运行 CDP 冒烟脚本（窗口渲染 + Rust 命令链路断言）
          # 注意：set -e 下 node 失败会直接终止脚本、跳过收尸与诊断，
          # 因此临时关闭 set -e 手动接管退出码（诊断逻辑内置在冒烟脚本内）
          set +e
          node e2e/smoke-ci.mjs
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== app.log（应用输出）==="
            cat e2e/app.log 2>/dev/null || true
          fi
          # 收尸：残留的 WebView2 子进程会锁定 user data 目录；删除一次性任务
          taskkill //IM typora-replica.exe //F 2>/dev/null || true
          taskkill //IM msedgewebview2.exe //F 2>/dev/null || true
          schtasks //Delete //TN markwell-smoke //F >/dev/null 2>&1 || true
          exit $EXIT_CODE
      - name: 上传冒烟日志（失败时可排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            e2e/vite.log
            e2e/app.log
          if-no-files-found: ignore
