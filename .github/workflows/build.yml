# Build Verification：Windows 构建 + E2E/Smoke 测试 + 产物归档
# PR 与 main 推送触发（合入需 Quality Gate 与 Build 均绿，由 GitHub 分支保护规则保证）。
name: Build Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Windows 构建 ─────────────────────────────────────────────
  tauri-build:
    name: Windows 构建（Tauri Build）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 额外缓存 tauri bundler 下载的工具链（NSIS 等），避免每次打包重新下载
          cache-directories: |
            $LOCALAPPDATA/tauri
            ~/.cache/tauri
      - name: 安装前端依赖
        run: npm ci
      - name: 前端类型检查与构建
        run: npm run build
      - name: Tauri 构建（release 安装包）
        shell: bash
        run: |
          set -euo pipefail
          # bundler 需下载 NSIS 等工具，网络偶发中断（io: Peer disconnected）时自动重试
          for attempt in 1 2 3; do
            echo "=== Tauri 构建尝试 $attempt/3 ==="
            if npx tauri build; then
              echo "Tauri 构建成功"
              exit 0
            fi
            echo "构建失败（疑似 bundler 下载工具的网络问题），清理部分缓存后重试..."
            rm -rf "$LOCALAPPDATA/tauri" "$HOME/.cache/tauri" 2>/dev/null || true
          done
          echo "::error::Tauri 构建连续 3 次失败"
          exit 1
      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  # ── CI 冒烟测试 ──────────────────────────────────────────────
  # 说明：CDP/WebDriver 类自动化在 CI 环境不可用——runner 镜像自带 WebView2
  # 150.0.4078.105 存在微软上游回归（提权进程下 CDP 调试端口静默不监听，
  # WebView2Feedback#5639），固定版本运行库与注册表策略注入亦不生效
  # （排查过程见 git 历史）。CI 冒烟降级为确定性验证（e2e/smoke-ci.mjs）：
  #   应用进程存活 + WebView2 初始化 + 前端页面由 WebView2 真实加载。
  # 完整 E2E（DOM 断言 + greet 命令链路）在本地正常，执行方式见 e2e/README。
  e2e:
    name: CI 冒烟（应用启动/WebView2 初始化/前端加载）
    runs-on: windows-latest
    needs: tauri-build
    # 总超时保护：任何步骤卡死不无限挂起
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装前端依赖
        run: npm ci
      - name: 编译 debug 二进制（冒烟目标，rust-cache 命中时快速）
        run: cargo build --manifest-path src-tauri/Cargo.toml
      - name: 启动 Vite dev server
        shell: bash
        run: |
          # 后台启动前端开发服务器，等待端口就绪后退出（供应用窗口加载）
          nohup npm run dev > e2e/vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s http://localhost:1420 > /dev/null; then echo "vite 已就绪"; exit 0; fi
            sleep 2
          done
          echo "vite 启动超时"; exit 1
      - name: 启动应用并运行冒烟测试
        shell: bash
        run: |
          set -euo pipefail
          # 环境前置诊断（便于对照 WebView2 版本与运行身份）
          echo "=== 运行身份 ==="
          whoami || true
          net session >/dev/null 2>&1 && echo "（当前进程为提权/管理员）" || echo "（当前进程非提权）"
          echo "=== WebView2 Runtime 版本（镜像自带）==="
          reg query "HKLM\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" //v pv 2>/dev/null || true
          ls -la src-tauri/target/debug/typora-replica.exe
          # 直接启动应用（确定性冒烟不依赖 CDP，提权与否无影响）
          src-tauri/target/debug/typora-replica.exe --use-localhost > e2e/app.log 2>&1 &
          # 注意：set -e 下 node 失败会直接终止脚本、跳过收尸，
          # 因此临时关闭 set -e 手动接管退出码（诊断逻辑内置在冒烟脚本内）
          set +e
          node e2e/smoke-ci.mjs
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== app.log（应用输出）==="
            cat e2e/app.log 2>/dev/null || true
          fi
          # 收尸：残留的 WebView2 子进程会锁定 user data 目录
          taskkill //IM typora-replica.exe //F 2>/dev/null || true
          taskkill //IM msedgewebview2.exe //F 2>/dev/null || true
          exit $EXIT_CODE
      - name: 上传冒烟日志（失败时可排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            e2e/vite.log
            e2e/app.log
          if-no-files-found: ignore
