# Build Verification：Windows 构建 + E2E/Smoke 测试 + 产物归档
# PR 与 main 推送触发（合入需 Quality Gate 与 Build 均绿，由 GitHub 分支保护规则保证）。
name: Build Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Windows 构建 ─────────────────────────────────────────────
  tauri-build:
    name: Windows 构建（Tauri Build）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 额外缓存 tauri bundler 下载的工具链（NSIS 等），避免每次打包重新下载
          cache-directories: |
            $LOCALAPPDATA/tauri
            ~/.cache/tauri
      - name: 安装前端依赖
        run: npm ci
      - name: 前端类型检查与构建
        run: npm run build
      - name: Tauri 构建（release 安装包）
        shell: bash
        run: |
          set -euo pipefail
          # bundler 需下载 NSIS 等工具，网络偶发中断（io: Peer disconnected）时自动重试
          for attempt in 1 2 3; do
            echo "=== Tauri 构建尝试 $attempt/3 ==="
            if npx tauri build; then
              echo "Tauri 构建成功"
              exit 0
            fi
            echo "构建失败（疑似 bundler 下载工具的网络问题），清理部分缓存后重试..."
            rm -rf "$LOCALAPPDATA/tauri" "$HOME/.cache/tauri" 2>/dev/null || true
          done
          echo "::error::Tauri 构建连续 3 次失败"
          exit 1
      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  # ── CI 冒烟测试 ──────────────────────────────────────────────
  # 说明：完整 WebDriver E2E（WebdriverIO + tauri-driver）因 CI 的 WebView2 150.x
  # 与 msedgedriver 自动化握手存在环境兼容问题（DevToolsActivePort），降级为
  # CDP 冒烟测试（e2e/smoke-ci.mjs），覆盖相同验证目标：
  #   应用启动 + 前端渲染 + Rust 命令链路。
  # 完整 E2E 在本地环境正常，执行方式见 e2e/README（npm run test:e2e）。
  e2e:
    name: CI 冒烟（应用启动/前端渲染/Rust 链路）
    runs-on: windows-latest
    needs: tauri-build
    # 总超时保护：任何步骤卡死不无限挂起
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装前端依赖
        run: npm ci
      - name: 编译 debug 二进制（冒烟目标，rust-cache 命中时快速）
        run: cargo build --manifest-path src-tauri/Cargo.toml
      - name: 启动 Vite dev server
        shell: bash
        run: |
          # 后台启动前端开发服务器，等待端口就绪后退出（供应用窗口加载）
          nohup npm run dev > e2e/vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s http://localhost:1420 > /dev/null; then echo "vite 已就绪"; exit 0; fi
            sleep 2
          done
          echo "vite 启动超时"; exit 1
      - name: 启动应用并运行冒烟测试
        shell: bash
        run: |
          set -euo pipefail
          # WebView2 调试参数注入：--remote-debugging-port=0 让 WebView2 自动开启
          # 调试端口并写 DevToolsActivePort 文件（冒烟脚本通过 CDP 连接）
          export WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS="--remote-debugging-port=0"
          ls -la src-tauri/target/debug/typora-replica.exe
          # 启动应用（加载 vite dev server 前端）
          src-tauri/target/debug/typora-replica.exe --use-localhost > e2e/app.log 2>&1 &
          APP_PID=$!
          # 运行 CDP 冒烟脚本（窗口渲染 + Rust 命令链路断言）
          node e2e/smoke-ci.mjs
          EXIT_CODE=$?
          taskkill //IM typora-replica.exe //F 2>/dev/null || true
          taskkill //IM msedgewebview2.exe //F 2>/dev/null || true
          exit $EXIT_CODE
      - name: 上传冒烟日志（失败时可排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            e2e/vite.log
            e2e/app.log
          if-no-files-found: ignore
