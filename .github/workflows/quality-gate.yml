# Quality Gate：PR 合入前的质量闸门（AGENTS.md 八、CI/CD 强制集成）
# 任何 PR 与 main/test 推送都会触发；任一 job 失败即阻断合入，禁止人工绕过。
# 2026-08-23 分支策略调整：模块合入目标由 main 改为 test（main 冻结），
# 触发分支同步加入 test，保证新流程下门禁继续生效（main 保留触发作兜底）。
#
# 组成：
#   frontend - ESLint / Prettier / vue-tsc / Vitest
#   rust     - rustfmt / clippy / cargo test（windows-latest：避免 Linux 缺 webkit2gtk 系统依赖）
#   security - gitleaks / npm audit / cargo-deny
name: Quality Gate

on:
  pull_request:
    branches: [main, test]
  push:
    branches: [main, test]

concurrency:
  # 同一分支的重复触发自动取消旧任务，节省 runner 资源
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

# 权限最小化：三个 job 均为只读检查（gitleaks 仅扫描报告，不做 PR 评论/写入）
permissions:
  contents: read

jobs:
  # ── 前端质量检查 ──────────────────────────────────────────────
  frontend:
    name: 前端（ESLint/Prettier/vue-tsc/Vitest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: ESLint 静态检查
        run: npx eslint .
      - name: Prettier 格式化检查
        run: npx prettier --check .
      - name: vue-tsc 类型检查
        run: npx vue-tsc --noEmit
      - name: Vitest 单元测试 + 覆盖率阈值
        # P1-6：thresholds 仅在 --coverage 下生效（coverage.enabled 默认 false），
        # 无 --coverage 时覆盖率滑坡不被捕获——门禁必须跑 test:coverage
        run: npm run test:coverage

  # ── Rust 质量检查（windows runner：Tauri 在 Linux 需额外系统库）──
  rust:
    name: Rust（fmt/clippy/test）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: rustfmt 格式化检查
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: clippy 静态分析（warnings 视为错误）
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: 全量单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # ── 安全检查 ──────────────────────────────────────────────────
  security:
    name: 安全（gitleaks/npm audit/cargo-deny）
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 全量克隆：gitleaks 对 PR 范围（base.sha^..head）做差异扫描，
      # 浅克隆缺父提交会报 unknown revision 并退出 1（实测两次运行 17s 即失败）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks 密钥泄露扫描
        # v3：GitHub 2026-09-16 起移除 Node 20 action 运行时，v2（Node 20）届时失效；
        # v2→v3 仅运行时迁移，输入/输出/行为无变化（官方 README 迁移指引）
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: npm audit 依赖漏洞扫描
        # 门槛 critical：dev 工具链存在 extract-zip 无修复版本的高危通告
        # （GHSA-jmr9-qjv8-65gv，仅影响解压不可信 zip；E2E 仅解压微软官方驱动，
        #   风险可控，待上游 @puppeteer/browsers 修复后自动转绿）
        run: npm audit --audit-level=critical
      - name: cargo-deny 依赖审查（bans/licenses/sources 严格阻断）
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # 许可证/禁用依赖/来源三检查严格失败（任一违规红门禁）；
          # advisories 拆分到下一步（官方推荐管道：防新安全公告突袭打断 CI）。
          # 注意：检查清单必须拼进 command（官方 README 形态），arguments 是
          # 单字符串通道，塞多值会被 cargo-deny 当未知子命令拒绝（实测踩坑）
          command: check bans licenses sources
          # Cargo 清单位于 src-tauri/ 子目录（Tauri 项目结构）
          manifest-path: src-tauri/Cargo.toml
      - name: cargo-deny 安全公告（advisories 不阻断，仅报告）
        # 官方推荐的 advisories 矩阵拆分：新公告发布时此步标红但不阻断合入，
        # 供人工评估升级时机；bans/licenses/sources 的严格性不受影响
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
          manifest-path: src-tauri/Cargo.toml
        continue-on-error: true
